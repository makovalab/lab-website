bio: Currently, Byung June focuses on telomere-to-telomere genome assembly and the functional research
  of chromatin's complex structure, particularly in sex chromosomes. Prior to bioinformatics, Byung June
  majored in conservation genetics, focusing on identifying the genetic diversity and structure of the
  leopard cat in the South Korea during his M.S. course, supervised by Prof. Soo Hyung Eo. This research
  sparked his interest in bioinformatics and genome functionality, leading to his false gene gain research
  collaboration with the Vertebrate Genomes Project during his Ph.D. course at Seoul National University,
  supervised by Prof. Heebal Kim. Outside of science, Byung June enjoyed playing bass and electric guitar
  and now enjoys weight lifting and walking in peaceful towns.
interests:
- Genome assembly of complex genomes
- Functionality of chromatin structure alteration
