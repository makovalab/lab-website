bio: Prof. Nekrutenko performed postdoctoral work at the University of Chicago where he found his interest
  in computational genomics. After moving to the Pennsylvania State University as an Assistant Professor,
  he and his collaborators developed the Galaxy platform for analysis of biological data. He is now a
  professor of biochemistry and molecular biology and founding member of galaxyproject.org.
