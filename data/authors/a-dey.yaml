bio: Arpita has a background in studying the molecular biophysical interactions of G-quadruplex and other
  quadruplex DNA structures involved in anticancer mechanisms. With a strong interest in cancer biology,
  she is now exploring the molecular evolutionary medicine of non-B-DNA structures in primates, focusing
  on G-quadruplexes (G4). Outside the lab, Arpita enjoys singing, cooking, and traveling to explore new
  places.
