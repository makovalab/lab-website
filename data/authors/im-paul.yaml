bio: Ian Paul, MD, MSc, graduated from Penn State College of Medicine and completed his residency training
  at Duke University Medical Center in Durham, N.C. In addition to his responsibilities as a general pediatrician
  at Penn State Pediatrics and in the newborn nursery, Dr. Paul spends much of his time working on a variety
  of research projects and clinical trials that seek to improve health care for children and their families.
  His current research includes studies to prevent obesity and help breastfeeding newborns.
