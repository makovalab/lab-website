bio: Dr. Holland is a Fellow in the American Academy of Forensic Sciences, and has served as an associate
  professorial lecturer and adjunct faculty member at various colleges and universities. Dr. Holland has
  been on the Editorial Board of the Journal of Forensic Sciences and a member of the Advisory Board of
  the International Journal of Legal Medicine. He has held positions on governmental and company advisory
  boards and has been recognized by the FBI and others for his work. Dr. Holland has had extensive experience
  with human remains identification cases, including the identification of victims from the World Trade
  Center disasters and from numerous commercial airline accidents. His rearch group is focused on advancing
  forensic DNA applications, especially in the area of forensic mitochondrial (mt) DNA analysis.
