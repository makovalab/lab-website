bio: Dr. Oliver Ryder serves San Diego Zoo Wildlife Alliance as the Kleberg Endowed Director of Conservation
  Genetics. He oversees research activities in the areas of molecular genetics, genomic studies, and genetic
  rescue efforts, including stem cell applications – all focused on reducing extinction risk and contributing
  to species recovery and sustainable populations. He guides the strategic development of efforts to develop
  and expand a global network of cryobanking facilities, especially for viable tissue culture cells.
