role: Postdoctoral Scholar
bio: Marie joined the Makova Lab as a postdoctoral researcher after completing her PhD at the Institute
  of Biophysics of the Czech Academy of Sciences, where her work in evolutionary genomics focused on repeatome
  dynamics and centromere evolution in holocentric plants. Her current project aims to elucidate how non-canonical
  DNA secondary structures influence gene expression and cell differentiation in primates. She also worked
  on cultivated meat, pathogen surveillance, and the development of antifibrotic hydrogels. In her free
  time, Marie enjoys plant-based cooking, book club meeting discussions, and dabbling in digital fabrication
  crafts.
