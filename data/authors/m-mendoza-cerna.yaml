bio: Currently, Mayra focuses on telomere-to-telomere (T2T) genome assembly and pangenomics, including the
  development of a Przewalski's horse pangenome to support conservation genomics and free-ranging population
  health management. She is also interested in non-B DNA structures and their role in genome biology. Prior
  to joining the Makova Lab, Mayra completed her Ph.D. in Genetics and Genomics at Texas A&M University,
  supervised by Dr. Terje Raudsepp, where she developed a chromosome-level reference genome for the alpaca
  (Vicugna pacos) integrating molecular cytogenetics and long-read sequencing — work that led to the
  identification of satellite DNA sequences specific to South American camelids. Outside of science, Mayra
  enjoys solving puzzles and spending quality time with her two young children.
interests:
