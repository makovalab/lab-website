bio: Mayra earned her Ph.D. in Genetics and Genomics at Texas A&M University, supervised by Dr. Terje Raudsepp, where she developed a chromosome-level reference genome for the alpaca (Vicugna pacos). Her work led to the identification of satellite DNA sequences specific to South American camelids. Beyond camelids, her research experience spans other mammals, including horses, aardwolves, and other placental mammals, with a broader interest in genome evolution. In the Makova Lab, she aims to expand her background in cytogenetics by exploring state-of-the-art technologies for the discovery and characterization of non-B DNA structures. Outside of science, Mayra enjoys solving puzzles and spending quality time with her two young children.
interests:
