# Project override of the module's share links (blox/data/page_sharer.yaml).
#
# The stock `email` entry emits `mailto:?subject=...&body=...` with no
# recipient, which html-proofer's Links check reports as "contains no email
# address" on every page. The old site's share widget had no such button, so
# dropping it keeps CI green without loosening the link checks.
links:
  - id: x
    url: 'https://x.com/intent/tweet?url={url}&text={title}'
    title: X
    icon: brands/x
    enable: true
  - id: facebook
    url: 'https://www.facebook.com/sharer.php?u={url}&t={title}'
    title: Facebook
    icon: brands/facebook
    enable: true
  - id: email
    url: 'mailto:?subject={title}&body={url}'
    title: Email
    icon: hero/at-symbol
    enable: false
  - id: linkedin
    url: 'https://www.linkedin.com/shareArticle?url={url}&title={title}'
    title: LinkedIn
    icon: brands/linkedin
    enable: true
