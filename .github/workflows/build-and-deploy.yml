name: Build and Deploy Site

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The theme builds its own CSS with the Tailwind CLI and its hero block
      # from preact, both of which come from package.json. Without them Hugo
      # fails on the first page it renders, so this has to run before the build.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pin an exact version. The theme is patched for this release, and Hugo
          # escalates deprecation warnings to hard errors ~15 minor versions after
          # they are announced, so 'latest' would break the build unattended.
          hugo-version: '0.164.0'
          extended: true

      - name: Build Site
        # --panicOnWarning turns the next deprecation cycle into a loud failure
        # instead of a silently wrong page. The build is warning-free today.
        run: hugo --panicOnWarning --printPathWarnings

      - name: Check Build Output
        run: |
          # Goldmark drops raw HTML unless markup.goldmark.renderer.unsafe is set;
          # content here depends on it (e.g. the iframe in content/video/2022-10.md).
          if grep -rq 'raw HTML omitted' public/; then
            echo "::error::Raw HTML was dropped -- check markup.goldmark.renderer.unsafe"
            exit 1
          fi
          # The home page is a stack of blocks from content/_index.md. A
          # .Data.Pages semantics change once made every section of it vanish
          # silently, so count them: hero, projects, news, press releases,
          # publications, videos, members, collaborators, contact.
          count=$(grep -c 'hbb-section' public/index.html || true)
          if [ "$count" -lt 9 ]; then
            echo "::error::Home page has $count block sections, expected at least 9"
            exit 1
          fi
          # Publications, and the people and project pages that reuse the same
          # view, render as citations. A theme change that dropped the override
          # would leave placeholder cards behind instead.
          cites=$(grep -c 'view-citation' public/publication/index.html || true)
          if [ "$cites" -lt 100 ]; then
            echo "::error::Publication list has $cites citations, expected ~139"
            exit 1
          fi

      # Ruby is only needed by html-proofer below, and it has to come after the
      # Hugo build rather than before it. `bundler-cache: true` installs gems
      # into vendor/bundle at the repository root, and Go turns on vendoring
      # automatically when it sees a vendor/ directory beside go.mod -- then
      # fails, because that directory holds gems and has no modules.txt listing
      # the Hugo modules. The old site had its theme committed under themes/ and
      # used no Go modules, so a stray vendor/ never mattered there.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        env:
          BUNDLE_BUILD__NOKOGIRI: --use-system-libraries

      - name: Check Site
        working-directory: ./public
        # swap-urls maps the deployed /makova_lab/ prefix onto the local public/
        # root so internal links resolve when checked from a working copy.
        # ignore-missing-alt and no-enforce-https are non-default; the rest of
        # html-proofer's defaults already match what this site needs.
        #
        # allow-missing-href is needed by the theme's search panel: its results
        # are an Alpine `<template x-for>` whose anchors carry `:href` rather
        # than `href`, so the attribute only exists once a search has run. It
        # appears on every page, which is 319 failures for markup that is valid
        # HTML5 and works at runtime.
        run: |
          bundle exec htmlproofer . \
            --checks Links,Images,Scripts \
            --disable-external \
            --ignore-missing-alt \
            --allow-missing-href \
            --no-enforce-https \
            --assume-extension .html \
            --extensions .html \
            --ignore-files "./404.html,./js/vendor/reveal.js/plugin/notes/notes.html" \
            --swap-urls "^/makova_lab/:/" \
            --log-level info

      - name: Deploy Site
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: ./public/
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_DIRECTORY }}

      - name: Update Site
        # Back on upstream: the fork existed only because upstream was stale at
        # Node 20, which 0.9.0 fixed. Inputs are unchanged.
        uses: garygrossgarten/github-action-ssh@0.9.0
        with:
          command: dummy
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          privateKey: ${{ secrets.UPDATE_KEY }}

