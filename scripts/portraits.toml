# Per-person settings for scripts/make-portraits.
#
# Most photos need nothing here -- the defaults handle them. This file records
# the exceptions, so that regenerating a portrait years from now reproduces what
# was actually approved, rather than needing the same problems rediscovered.
#
# The key is the member id, which is also what the finished portrait is named:
# id linnea_smeds means content/member/linnea_smeds.md and
# static/img/member/linnea_smeds.png. Any option below overrides the default;
# anything given explicitly on the command line still wins over this file.
#
#   source           the photo this portrait is made from, relative to the top
#                    of the repository. These live in photos/originals/, named
#                    after the member, and are committed: the portraits are
#                    worth nothing without the ability to remake them, and the
#                    workspace they were recovered from is not in the repo and
#                    has been partly lost once already.
#                    ./scripts/make-portraits --from-registry rebuilds every
#                    portrait recorded here from its own source.
#   origin           where that photo was originally found, for provenance.
#                    Nothing reads this; it is here because the trail back to
#                    an old site backup or a deleted branch is not recoverable
#                    once forgotten.
#   size             edge length in pixels, when the measured one is wrong.
#                    Normally omitted: the script measures the head and picks
#                    the largest of 200/400/600 the photo fills without being
#                    enlarged. Set this to hold a photo down to a smaller size
#                    when it is nominally large but soft or noisy.
#   model            rembg model: u2net_human_seg (default, 168MB)
#                    or birefnet-portrait (928MB, cleaner on stray fragments)
#   union_model      a second model; small pieces it keeps and the first drops
#                    are added back. For recovering a body part one model loses
#                    without also recovering whatever else it keeps.
#   lighting         true to even out exposure and contrast
#   lighting_strength  0-1, how much of that correction to apply (default 0.7)
#   defringe         false to keep colour picked up at the cut-out edge
#   keep_background  true to leave the photo's own background alone
#   detect           false to centre-crop instead of finding the face
#   note             why -- for whoever reads this next
#
# The originals were matched to the published portraits by comparing faces
# rather than filenames, which is what scripts/verify_portrait_sources.py does.
# Filenames proved actively misleading: they paired a portrait with an
# illustration of that person, with a different person sharing a name, and with
# a much older photo of the right one.

[arpita]
source = "photos/originals/arpita.png"
origin = "images/from-git-history/arpita.png"

[bruce]
source = "photos/originals/bruce.png"
origin = "images/from-old/img/bruce.png"
model = "birefnet-portrait"
note = """u2net_human_seg fails on this photo outright -- it keeps the wall behind his
head, so the orange room survives into the portrait. The version on the site
before this had the same problem. Worth knowing that this is not visible in the
usual summary statistics: its matte covers 67% of the frame, the same as photos
that worked, because what it gets wrong is local to the head. birefnet-portrait
cuts him out cleanly. The parrot on his shoulder is kept: it is his, and it was
in the published portrait too."""

[byung_june]
source = "photos/originals/byung_june.jpg"
origin = "images/original/current/byung_june.jpg"
model = "birefnet-portrait"
union_model = "u2net_human_seg"
lighting = true
lighting_strength = 1.0
note = """There is a second person behind him, backpack strap and all. birefnet-portrait
excludes them but also mattes his ear away; u2net_human_seg keeps the ear but
keeps the stranger too. So both are run and the small pieces only birefnet
missed -- his ear at ~2000px -- are added back, while the stranger at ~98000px
is not. His photo is also underexposed enough that the usual partial correction
leaves him darker than everyone else, so correct him fully."""

