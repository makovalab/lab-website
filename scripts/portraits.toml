[linnea_smeds]
note = """no usable source, despite appearances. Linnea_Smeds_new_photo.png in the git
history matches her face almost exactly -- it is a 4032x3024 canvas with an
already-circular, already-cut-out avatar sitting in the middle of it. Face
matching ranks it first precisely because it is descended from the same sitting,
not because it is the original. Running it through again crops a circle inside
that circle: it clips her hair, drops her shoulders and leaves the old crop's
rectangle showing. Her committed 200x200 is better than anything that file can
produce, so it is left alone. Recorded here so the next person does not
rediscover this by regenerating it."""

